appId: com.jinju-finance.app
productName: 金桔财务系统
directories:
  buildResources: build
files:
  - '**/*'
  - '!node_modules'
  - 'node_modules/sql.js'
  - 'node_modules/sql.js/dist/sql-wasm.wasm'
  - 'node_modules/sql.js/dist/sql-wasm.js'
  - '!**/*.map'
  - '!**/*.md'
  - '!**/*.ts'
  - '!**/*.tsx'
  - '!**/.git*'
  - '!**/build/*'
  - '!**/dist/*'
  - '!**/electron-builder.yml'

extraResources:
  - from: 'node_modules/sql.js/dist'
    to: 'node_modules/sql.js/dist'
    filter: ['**/*']

win:
  target:
    - nsis
    - portable
  icon: build/icon.ico

mac:
  target: dmg
  icon: build/icon.icns
  category: public.app-category.finance

linux:
  target: AppImage
  category: Office
